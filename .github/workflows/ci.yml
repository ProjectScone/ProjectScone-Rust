name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimal
            features: --no-default-features
          - profile: default
            features: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: Cache embedding model for semantic temporal tests
        if: matrix.profile == 'default'
        uses: actions/cache@v4
        with:
          path: ~/.scone/models--Xenova--bge-small-en-v1.5
          key: embed-model-bge-small-en-v1.5
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy and type checking
        run: cargo clippy --locked --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        # Default temporal-operator tests provision/reuse the local model.
        # Additional model-download and long-running probes remain ignored.
        run: cargo test --locked --workspace ${{ matrix.features }}
      - name: Build deterministic external conformance probe
        if: matrix.profile == 'minimal'
        run: cargo build --locked -p scone-core --no-default-features --example episode_roundtrip
